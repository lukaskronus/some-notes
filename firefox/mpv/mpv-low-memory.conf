# ==========    GENERAL    ==========
ontop=yes                                         # Kept from your config (change to 'no' if it gets annoying)
geometry=x40%-0-0
autofit=80%x80%
force-seekable=yes
keep-open=yes
reset-on-next-file=pause
msg-color=yes                                     # Color console output
msg-module=yes
image-display-duration=inf
hr-seek=yes                                       # Precise seeks
vd-lavc-fast=yes
input-default-bindings=no
autocreate-playlist=filter
user-agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:151.0) Gecko/20100101 Firefox/151.0'

# ==========    VIDEO    ==========
vo=gpu-next
hwdec=auto-safe                                   # Safe hardware decoding (prevents iGPU crashes)
gpu-api=d3d11                                     # Best for Windows. Use 'vulkan' if on Linux.
deinterlace=auto
hdr-compute-peak=no                               # CRITICAL: Disabled to save iGPU compute power on SDR content (Twitch/YouTube)
dither-depth=auto

# ==========    CACHE & STREAMING (RAM-Safe for 8GB) ==========
cache=yes                                  
demuxer-max-bytes=150MiB                      # Reduced from 500MiB to prevent RAM exhaustion
demuxer-readahead-secs=15                     # Balanced: low latency for live, enough buffer for VOD
demuxer-max-back-bytes=50MiB                  # Reduced from 200MiB for safe backward seeking
load-unsafe-playlists=yes

# ==========    NETWORK    ==========
network-timeout=50
stream-lavf-o=request_size=10485760,multiple_requests=1
stream-lavf-o-append=reconnect_on_http_error=4xx,5xx
stream-lavf-o-append=reconnect_delay_max=30
stream-lavf-o-append=reconnect_streamed=yes

# ==========    YT-DLP  ==========
script-opts=ytdl_hook-try_ytdl_first=no,ytdl_hook-exclude="%.webm$|%.ts$|%.mp3$|%.m3u8$|%.m3u$|%.mkv$|%.mp4$|%.VOB$|%.wmv$|%.ogg$|%.mpd$|%.mov$|%.webp$|%.avi$|%.flv$|%.swf$|%.f4v$"

ytdl-raw-options=no-write-comments=,yes-playlist=,write-auto-subs=,sub-langs="en.*,vi.*"
ytdl-raw-options-append=extractor-args=youtube:player_client=android_vr,web_embedded
ytdl-raw-options-append=format-sort=proto:https
ytdl-raw-options-append=remote-components=ejs:github

# ==========    DEBANDING    ==========
deband=no                                       # Keep off by default, toggle via keybind (h) to save GPU
deband-iterations=1
deband-threshold=48
deband-range=32
deband-grain=32

# ==========    OSD & CONTROLLER    ==========
osd-bar=no                                      # Assuming you use uosc
osc=no                                          # Assuming you use modern-x
border=no
cursor-autohide=100
osd-level=1
osd-duration=1000
osd-font="Aptos Narrow"
osd-font-size=48
osd-color='#FFFFFF'
osd-border-size=2.4
osd-shadow-offset=0.75
osd-bold=yes

# ==========    LANGUAGE PRIORITY    ==========
track-auto-selection=yes
alang=vi,vie,en,eng
slang=en,eng,vi,vie
sid=no

# ==========    AUDIO    ==========
volume=100
volume-max=200
audio-pitch-correction=yes
audio-file-auto=fuzzy

# ==========    SUBTITLES    ==========
demuxer-mkv-subtitle-preroll=yes
sub-fix-timing=no
sub-auto=fuzzy
sub-file-paths-append=ass
sub-file-paths-append=srt
sub-file-paths-append=pgs
sub-file-paths-append=vob
sub-file-paths-append=sub
sub-file-paths-append=sup
sub-file-paths-append=subs
sub-file-paths-append=subtitles

sub-font="Aptos Narrow"
sub-font-size=52
sub-bold=yes
sub-color='#ffffff'
sub-border-color="#FF000000"
sub-shadow-color=0.0/0.0/0.0/0.70
sub-border-size=2.0
sub-shadow-offset=0.75
sub-spacing=0.0
sub-use-margins=no
sub-gauss=0.05

# ==========    SCALING & INTERPOLATION    ==========
glsl-shaders-clr
scale=lanczos                                   # High quality, Vega 11 can handle this at 1080p
cscale=catmull_rom
dscale=hermite
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
hdr-peak-percentile=100
hdr-contrast-recovery=0.0
allow-delayed-peak-detect=no

# ==========    TONE-MAPPING    ==========
target-colorspace-hint=no
tone-mapping=spline
libplacebo-opts-append=gamut_expansion=yes
libplacebo-opts-append=perceptual_deadzone=0.4
libplacebo-opts-append=perceptual_strength=0.5

# ==========    SMART PROFILES (The Magic)    =============

# 1. LIVE STREAMS (Twitch, YouTube Live, Streamlink)
# Priority: Lowest latency, minimal RAM usage, no unnecessary processing
[live-stream]
profile-cond=string.find(path, 'twitch') ~= nil or string.find(path, 'youtube.*live') ~= nil or string.find(path, '127.0.0.1') ~= nil or string.find(path, 'localhost') ~= nil
profile-restore=copy-equal
demuxer-max-bytes=100MiB
demuxer-readahead-secs=5                        # Near real-time for live streams
demuxer-max-back-bytes=25MiB
ytdl-format=bv[height<=?1080][vcodec*=?avc1]+ba[acodec*=?opus]/best  # Prefer AVC for lowest CPU/GPU decode load on live

# 2. YOUTUBE VOD (Pre-fetch for smooth scrubbing, cap resolution)
[youtube-vod]
profile-cond=string.find(path, 'youtube') ~= nil or string.find(path, 'youtu.be') ~= nil or string.find(path, 'yt.be') ~= nil
profile-restore=copy-equal
demuxer-max-bytes=200MiB
demuxer-readahead-secs=30                       # More buffer for smooth scrubbing in VODs
ytdl-format=bv[height<=?1080][vcodec*=?avc1]+ba[acodec*=?opus]/bv[height<=?1080]+ba/best

# 3. LOCAL FILES (Allow more cache for smooth seeking on your drive)
[local-file]
profile-cond=not string.match(path, '^http') ~= nil
profile-restore=copy-equal
demuxer-max-bytes=250MiB
demuxer-readahead-secs=30
demuxer-max-back-bytes=100MiB

# 4. DIRECT STREAMS / PLAYLISTS (Bypass yt-dlp entirely)
[stream-no-ytdl]
profile-cond=string.find(path, '%.m3u') ~= nil or string.find(path, '%.mpd') ~= nil or string.find(path, 'googlevideo%.') ~= nil or string.find(path, '%.ts') ~= nil
profile-restore=copy-equal
ytdl=no
