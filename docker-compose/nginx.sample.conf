worker_processes 1;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    server_tokens off;

    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Tắt access_log mặc định để tránh ghi log liên tục lên eMMC
    access_log off;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        # Trang gốc mặc định (tùy chọn)
        location = / {
            return 302 /site1/;
        }

        # Static site 1 tại http://<IP-server>:8080/site1/
        location /site1/ {
            alias /srv/sites/site1/;
            index index.html;
            try_files $uri $uri/ /site1/index.html;
        }

        # Static site 2 tại http://<IP-server>:8080/site2/
        location /site2/ {
            alias /srv/sites/site2/;
            index index.html;
            try_files $uri $uri/ /site2/index.html;
        }
    }
}
